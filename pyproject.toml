[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gdof"
version = "1.1"
description = "Label-informed outlier detection based on granule density"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23", "torch>=1.8.2"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.2"]

[tool.setuptools.packages.find]
include = ["gdof*"]
